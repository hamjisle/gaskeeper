<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>가스키퍼: 누출의 심연 | 오프라인 액션 RPG</title>
<style>
/*__GASKEEPER_CSS__*/
</style>
</head>
<body>
<div id="app" class="rpg-app"></div>
<div id="modal-root"></div>
<script>
/*__GASKEEPER_CORE_BUNDLE__*/
</script>
<script>
(function(){
"use strict";

// ===== localStorage keys (must be assigned before the initial loadProfile()/loadReports()/loadReviewQueue() calls below) =====
var PROFILE_KEY="gaskeeper-offline-profile-v1";
var REPORTS_KEY="gaskeeper-offline-reports-v1";
var REVIEW_QUEUE_KEY="gaskeeper-offline-review-queue-v1";

// ===== state =====
var screen="title", difficulty="elementary", scenarioChoice="random", scenarioId="kitchen";
var teacherMode=false, experienceMode="action";
var storyStep=0, storyWrong=0, storySparkHits=0, storyStartedAt=0;
var voiceEnabled=true, reducedFx=false, largeText=false, leftHanded=false;
var showTouchGuide=false, showMissionPanel=false;
var stick={x:0,y:0};
var hud=GK.emptyHud("elementary");
var message="관제관의 지시를 확인하세요.";
var activeQuestion=null, feedback=null, rewindInfo=null;
var activeDeduction=false, deductionFeedback=null, deductionEvidence=[];
var result=null, sessionReports=[];
var showDashboard=false;
var profile=loadProfile();
var dashboardReports=loadReports();
var reviewQueue=loadReviewQueue(), reviewFeedback=null, reviewBannerDismissed=false, reviewVisibleChoices=[];
var run=null, paused=true;
var input={up:false,down:false,left:false,right:false,axisX:0,axisY:0};
var joystickPointerId=null, pulseTimer=null, audioCtx=null;
var canvasEl=null, ctx2d=null, rafId=0, lastFrame=0, hudClock=0, canvasDpr=1;
var visibleChoices=[], visibleDeductionChoices=[], visibleCrisisChoices=[];

var app=document.getElementById("app");
var modalRoot=document.getElementById("modal-root");

// ===== small helpers =====
function $(sel,root){return (root||document).querySelector(sel);}
function cfg(){return GK.DIFFICULTIES[difficulty];}
function scenario(){return GK.SCENARIOS[scenarioId];}
function currentQuestion(){return activeQuestion?GK.safetyQuestion(activeQuestion,difficulty,scenarioId):null;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function tone(freq,dur,type,pan){
  dur=dur||.08; type=type||"sine"; pan=pan||0;
  try{
    var AudioCtor=window.AudioContext||window.webkitAudioContext;
    var ac=audioCtx||(audioCtx=new AudioCtor());
    var o=ac.createOscillator(),g=ac.createGain(),p=ac.createStereoPanner();
    o.type=type;o.frequency.value=freq;p.pan.value=GK.clamp(pan,-1,1);
    g.gain.setValueAtTime(.055,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
    o.connect(g);g.connect(p);p.connect(ac.destination);o.start();o.stop(ac.currentTime+dur);
  }catch(e){}
}
function speak(text){
  if(!voiceEnabled||!("speechSynthesis" in window))return;
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);u.lang="ko-KR";u.rate=1.02;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function haptic(pattern){try{if("vibrate" in navigator)navigator.vibrate(pattern||16);}catch(e){}}
function setMessage(text){message=text;var el=$(".message-scroll");if(el)el.textContent=text;var el2=$(".story-card .message-scroll");if(el2)el2.textContent=text;}
function formatTime(s){return GK.formatTime(s);}

// ===== localStorage profile / classroom dashboard (mirrors the online /api/reports logic) =====
function emptyProfile(){return {xp:0,streak:0,missions:0,bestIndex:0,badges:[],sensorLevel:1,suitTier:1};}
function loadProfile(){try{var raw=localStorage.getItem(PROFILE_KEY);return raw?JSON.parse(raw):emptyProfile();}catch(e){return emptyProfile();}}
function saveProfileToStorage(){try{localStorage.setItem(PROFILE_KEY,JSON.stringify(profile));}catch(e){}}
function loadReports(){try{var raw=localStorage.getItem(REPORTS_KEY);return raw?JSON.parse(raw):[];}catch(e){return [];}}
function saveReportsToStorage(){try{localStorage.setItem(REPORTS_KEY,JSON.stringify(dashboardReports.slice(0,200)));}catch(e){}}
function loadReviewQueue(){try{var raw=localStorage.getItem(REVIEW_QUEUE_KEY);return raw?JSON.parse(raw):[];}catch(e){return [];}}
function saveReviewQueueToStorage(){try{localStorage.setItem(REVIEW_QUEUE_KEY,JSON.stringify(reviewQueue));}catch(e){}}
function recordMistake(questionId){
  reviewQueue=GK.addMistake(reviewQueue,{questionId:questionId,scenarioId:scenarioId,difficulty:difficulty,at:Date.now()});
  saveReviewQueueToStorage();
}
var BADGE_BY_SCENARIO={kitchen:"LNG 배지",restaurant:"LPG 배지",camping:"부탄가스 배지",laboratory:"배관 분석 배지",boiler:"CO 배지"};

function saveMission(report){
  var safetyIndex=report.safetyIndex, victory=report.victory;
  var badges=new Set(profile.badges||[]);
  if(victory)badges.add("첫 봉인");
  if(safetyIndex>=90)badges.add("골든타임 마스터");
  if(report.rescued>=2)badges.add("구조 수호자");
  if(report.sparkHits===0)badges.add("무점화 완수");
  if((report.maxCombo||0)>=5)badges.add("SAFE 콤보 마스터");
  if(report.crisisSuccess)badges.add("5초 골든 세이브");
  badges.add(BADGE_BY_SCENARIO[report.scenarioId]||"가스안전 배지");
  var missions=(profile.missions||0)+1;
  var xp=(profile.xp||0)+report.score+safetyIndex*4;
  var streak=victory?(profile.streak||0)+1:0;
  var bestIndex=Math.max(profile.bestIndex||0,safetyIndex);
  var sensorLevel=Math.min(5,1+Math.floor(missions/2)+Math.floor(badges.size/4));
  var suitTier=Math.min(4,1+Math.floor(xp/2600));
  profile={xp:xp,streak:streak,missions:missions,bestIndex:bestIndex,badges:Array.from(badges),sensorLevel:sensorLevel,suitTier:suitTier};
  saveProfileToStorage();
  var stored=Object.assign({},report,{id:Date.now()});
  dashboardReports=[stored].concat(dashboardReports);
  saveReportsToStorage();
}
function dashboardData(){return dashboardReports.length?dashboardReports:sessionReports;}
function classroomStats(){
  var rows=dashboardData();
  if(!rows.length)return null;
  var average=Math.round(rows.reduce(function(s,i){return s+i.safetyIndex;},0)/rows.length);
  var mistakes=rows.filter(function(i){return i.wrongChoices>0;}).length;
  var sparks=rows.reduce(function(s,i){return s+i.sparkHits;},0);
  var response=Math.round(rows.reduce(function(s,i){return s+i.timeUsed;},0)/rows.length);
  return {average:average,mistakes:mistakes,sparks:sparks,response:response,count:rows.length};
}
function dashboardMistakes(){
  var counts=new Map();
  dashboardData().forEach(function(i){if(i.lastMistake)counts.set(i.lastMistake,(counts.get(i.lastMistake)||0)+1);});
  return Array.from(counts.entries()).sort(function(a,b){return b[1]-a[1];}).slice(0,4);
}
function dashboardGrowth(){
  var d=dashboardData();
  return d.length>1?d[0].safetyIndex-d[d.length-1].safetyIndex:0;
}
function exportCsv(){
  var header=["일시","시나리오","난이도","안전지수","판단력","대응시간(초)","구조","오답","스파크"];
  var rows=dashboardData().map(function(i){return [i.createdAt||"",GK.SCENARIOS[i.scenarioId].place,GK.DIFFICULTIES[i.difficulty].label,i.safetyIndex,i.safetyJudgment,Math.round(i.timeUsed),i.rescued,i.wrongChoices,i.sparkHits];});
  var csv=[header].concat(rows).map(function(row){return row.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  var blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download="gaskeeper-classroom-"+new Date().toISOString().slice(0,10)+".csv";a.click();
  URL.revokeObjectURL(url);
}
function resetDashboard(){
  if(!window.confirm("이 기기의 체험교실 누적 기록과 캐릭터 성장을 초기화할까요?"))return;
  profile=emptyProfile();saveProfileToStorage();
  dashboardReports=[];saveReportsToStorage();
  sessionReports=[];
  renderDashboard();
}
function exportResultCard(){
  if(!result)return;
  var cardScenario=GK.SCENARIOS[result.scenarioId], cardDifficulty=GK.DIFFICULTIES[result.difficulty];
  var rankInfo=result.victory?(result.safetyIndex>=90?{icon:"👑",title:"골든타임 가스키퍼"}:result.safetyIndex>=75?{icon:"🛡️",title:"가스안전 수호기사"}:{icon:"◆",title:"현장 대응기사"}):{icon:"📜",title:"현장 견습기사"};
  var canvas=document.createElement("canvas");canvas.width=1200;canvas.height=630;
  var c=canvas.getContext("2d");if(!c)return;
  var bg=c.createLinearGradient(0,0,1200,630);bg.addColorStop(0,"#171a1f");bg.addColorStop(1,"#0a0c0f");c.fillStyle=bg;c.fillRect(0,0,1200,630);
  c.strokeStyle="#665638";c.lineWidth=6;c.strokeRect(18,18,1164,594);
  c.textAlign="center";
  c.fillStyle="#8e7746";c.font="900 20px Georgia, serif";c.fillText("GASKEEPER · 대한민국 가스안전 RPG",600,78);
  c.font="120px sans-serif";c.fillText(rankInfo.icon,600,240);
  c.fillStyle="#f0e4cb";c.font="700 46px Georgia, 'Batang', serif";c.fillText(rankInfo.title,600,300);
  c.fillStyle="#a9a49a";c.font="20px sans-serif";c.fillText(cardScenario.icon+" "+cardScenario.place+" · "+cardDifficulty.label,600,340);
  c.fillStyle="#8b7546";c.font="700 16px Georgia, serif";c.fillText("SAFETY INDEX",600,400);
  c.fillStyle="#efd27c";c.font="700 88px Georgia, serif";c.fillText(String(result.safetyIndex),600,478);
  var stats=[["안전 행동",result.seals+" / 3"],["구조 완료",result.rescued+" / 2"],["위험 판단",result.wrongChoices+"회"],["스파크 유발",result.sparkHits+"회"]];
  var colW=1164/4;
  stats.forEach(function(pair,index){
    var cx=42+colW*index+colW/2;
    c.fillStyle="#d6d1c7";c.font="700 26px Georgia, serif";c.fillText(pair[1],cx,548);
    c.fillStyle="#787f84";c.font="14px sans-serif";c.fillText(pair[0],cx,572);
  });
  c.fillStyle="#5b5238";c.font="15px sans-serif";c.fillText("탐지 → 전기·화기 조작 금지 → 차단 → 자연환기 → 대피 → 안전한 곳에서 신고",600,608);
  var link=document.createElement("a");link.href=canvas.toDataURL("image/png");link.download="gaskeeper-result-"+result.scenarioId+"-"+Date.now()+".png";link.click();
}

// ===== title screen =====
function applyLargeText(){var z=largeText?"1.16":"1";app.style.zoom=z;modalRoot.style.zoom=z;}
function pickDifficulty(key){difficulty=key;hud=GK.emptyHud(key);tone(330+(key==="middle"?90:key==="high"?160:0),.06,"triangle");renderTitle();}
function pickScenarioChoice(id){scenarioChoice=id;renderTitle();}
function toggleTeacherMode(on){teacherMode=on;renderTitle();}
function dismissReviewBanner(){reviewBannerDismissed=true;renderTitle();}
function setExperienceMode(mode){experienceMode=mode;renderTitle();}

function renderTitle(){
  screen="title";
  var d=GK.DIFFICULTIES;
  var diffButtons=Object.keys(d).map(function(key){
    var item=d[key], guide=GK.LEVEL_GUIDES[key], stats=GK.LEVEL_STATS[key];
    var pips=Array.from({length:3},function(_,i){return '<u class="'+(i<item.pips?"on":"")+'"></u>';}).join("");
    return '<button class="'+(difficulty===key?"selected ":"")+key+'" onclick="G.pickDifficulty(\''+key+'\')"><span>'+item.icon+'</span><b>'+item.label+'</b><small>'+guide.label+' · '+item.tag+'</small><i>'+stats.summary+'</i><em>'+pips+'</em></button>';
  }).join("");
  var stats=classroomStats();
  var scenarioSelector=teacherMode?(
    '<div class="scenario-selector"><small>교사용 사고 시나리오</small><div><button class="'+(scenarioChoice==="random"?"selected":"")+'" onclick="G.pickScenarioChoice(\'random\')">🎲 무작위</button>'+
    Object.keys(GK.SCENARIOS).map(function(id){var s=GK.SCENARIOS[id];return '<button class="'+(scenarioChoice===id?"selected":"")+'" onclick="G.pickScenarioChoice(\''+id+'\')">'+s.icon+' '+s.place+'</button>';}).join("")+
    '</div>'+(stats?('<p>누적 '+stats.count+'회 · 평균 안전지수 <b>'+stats.average+'</b> · 위험판단 발생 '+stats.mistakes+'회</p>'):'')+
    '<button class="dashboard-open" onclick="G.openDashboard()">📊 교사용 학습 대시보드 열기</button></div>'
  ):"";
  app.innerHTML=
    '<section class="title-screen">'+
      '<div class="title-mist mist-a"></div><div class="title-mist mist-b"></div>'+
      '<header class="title-brand"><span class="rune-logo">G</span><div><small>대한민국 행동형 가스안전 RPG</small><b>GASKEEP · 180</b></div></header>'+
      '<div class="title-grid"><div class="title-copy">'+
        '<span class="chapter-label">180초 골든타임 · 행동 기반 안전 시뮬레이션</span>'+
        '<h1>가스키퍼<br><em>누출의 심연</em></h1>'+
        '<p>수호기사 <b>가온</b>이 되어 보이지 않는 누출원을 탐지하세요. 올바른 차단·자연환기·대피·신고 행동만이 가스 균열의 재출현을 멈추고 폭압 군주를 약화시킵니다.</p>'+
        '<div class="rpg-features"><span>🔎 증거 수집·추리</span><span>×5 SAFE 콤보</span><span>⏱ 5초 위기판단</span><span>☠ 행동형 보스 브레이크</span><span>⏪ 사고 리플레이</span><span>📊 교사용 분석</span></div>'+
        '<div class="difficulty-runes" aria-label="난이도 선택">'+diffButtons+'</div>'+
        '<div class="experience-modes" aria-label="체험 방식 선택"><button class="'+(!teacherMode?"selected":"")+'" onclick="G.toggleTeacherMode(false)">개인 체험</button><button class="'+(teacherMode?"selected":"")+'" onclick="G.toggleTeacherMode(true)">교사용 체험교실</button></div>'+
        '<div class="experience-modes" aria-label="진행 방식 선택"><button class="'+(experienceMode==="action"?"selected":"")+'" onclick="G.setExperienceMode(\'action\')">⚡ 실시간 액션</button><button class="'+(experienceMode==="story"?"selected":"")+'" onclick="G.setExperienceMode(\'story\')">📖 스토리 전용</button></div>'+
        (experienceMode==="story"?'<p class="story-mode-note">전투·타이머 없이 증거→추리→차단→환기→신고→위기판단 순서로 압박 없이 진행합니다.</p>':'')+
        scenarioSelector+
        '<div class="profile-strip"><div><span>수호복 TIER '+profile.suitTier+'</span><b>가온 · 탐지기 LV.'+profile.sensorLevel+'</b></div><p>누적 XP <strong>'+profile.xp.toLocaleString()+'</strong> · 연속 성공 <strong>'+profile.streak+'</strong> · 최고 안전지수 <strong>'+profile.bestIndex+'</strong></p><button onclick="G.openDashboard()">성장·기록</button></div>'+
        (reviewQueue.length&&!reviewBannerDismissed?('<div class="review-banner"><div><span>📚 오답 복습</span><b>지난번 틀린 문제 '+reviewQueue.length+'개가 남아 있어요</b></div><div><button class="plain-button" onclick="G.dismissReviewBanner()">나중에</button><button class="gold-button compact" onclick="G.startReview()"><span>복습하기</span></button></div></div>'):'')+
        '<button class="gold-button" onclick="G.prepareBriefing()"><span>'+cfg().time+'초 '+cfg().tag+' 임무를 시작한다</span><b>START GOLDEN TIME</b></button>'+
      '</div>'+
      '<div class="hero-portrait" aria-label="가스안전 수호기사 가온">'+
        '<div class="portrait-halo"></div><div class="portrait-staff"><i></i><b></b></div>'+
        '<div class="portrait-body"><span class="portrait-badge">G</span></div>'+
        '<div class="portrait-head"><span class="portrait-visor"></span></div>'+
        '<div class="portrait-shield">GAS<br><small>SAFE</small></div>'+
        '<div class="portrait-name"><small>가스안전 수호기사</small><b>가온</b></div>'+
      '</div></div>'+
      '<footer class="title-footer">키보드 · 마우스 · 터치스크린 지원 <span>│</span> 차단 전에는 가스 균열이 계속 재출현합니다</footer>'+
    '</section>';
  applyLargeText();
}

// ===== dashboard =====
function openDashboard(){showDashboard=true;renderDashboard();}
function closeDashboard(){showDashboard=false;var el=$("#dashboard-root");if(el)el.remove();}
function renderDashboard(){
  var el=$("#dashboard-root");
  if(!showDashboard){if(el)el.remove();return;}
  var data=dashboardData();
  var stats=classroomStats();
  var growth=dashboardGrowth();
  var mistakes=dashboardMistakes();
  var html='<div class="dashboard-overlay" id="dashboard-root" role="dialog" aria-modal="true"><section class="dashboard-sheet"><header><div><span class="chapter-label">TEACHER LEARNING ANALYTICS</span><h2>가스안전 체험교실 대시보드</h2><p>이 기기에서 누적된 수행 결과를 사고 유형·난이도·행동 오류별로 분석합니다.</p></div><button onclick="G.closeDashboard()" aria-label="대시보드 닫기">×</button></header>'+
    '<div class="dashboard-kpis"><div><span>누적 체험</span><b>'+(stats?stats.count:0)+'</b><small>회</small></div><div><span>평균 안전지수</span><b>'+(stats?stats.average:0)+'</b><small>/ 100</small></div><div><span>평균 대응시간</span><b>'+(stats?stats.response:0)+'</b><small>초</small></div><div><span>사전→사후 성장</span><b class="'+(growth>=0?"up":"down")+'">'+(growth>=0?"+":"")+growth+'</b><small>점</small></div></div>';
  if(data.length){
    html+='<div class="dashboard-grid"><article><h3>시나리오별 성취</h3>'+Object.keys(GK.SCENARIOS).map(function(id){
      var rows=data.filter(function(i){return i.scenarioId===id;});
      var avg=rows.length?Math.round(rows.reduce(function(s,i){return s+i.safetyIndex;},0)/rows.length):0;
      return '<div class="metric-row"><span>'+GK.SCENARIOS[id].icon+' '+GK.SCENARIOS[id].place+'</span><i><b style="width:'+avg+'%"></b></i><strong>'+(rows.length?avg:"-")+'</strong></div>';
    }).join("")+'</article>'+
    '<article><h3>난이도 비교</h3>'+Object.keys(GK.DIFFICULTIES).map(function(id){
      var rows=data.filter(function(i){return i.difficulty===id;});
      var avg=rows.length?Math.round(rows.reduce(function(s,i){return s+i.safetyIndex;},0)/rows.length):0;
      return '<div class="metric-row"><span>'+GK.DIFFICULTIES[id].icon+' '+GK.DIFFICULTIES[id].label+'</span><i><b style="width:'+avg+'%"></b></i><strong>'+(rows.length?avg:"-")+'</strong></div>';
    }).join("")+'<div class="growth-note"><b>학습 성장 해석</b><p>'+(growth>0?('첫 체험보다 최근 체험이 '+growth+'점 향상되었습니다.'):growth<0?('최근 체험이 첫 체험보다 '+Math.abs(growth)+'점 낮습니다. 오답 되감기로 재학습하세요.'):'2회 이상 체험하면 사전·사후 성장 폭이 표시됩니다.')+'</p></div></article>'+
    '<article><h3>반복 위험 행동</h3>'+(mistakes.length?mistakes.map(function(pair,index){return '<div class="mistake-row"><i>'+(index+1)+'</i><span>'+esc(pair[0])+'</span><b>'+pair[1]+'회</b></div>';}).join(""):'<p class="empty-analysis">기록된 위험 판단이 없습니다.</p>')+'<small class="teacher-tip">상위 오류 문장을 먼저 토론한 뒤 같은 시나리오를 재도전해 보세요.</small></article>'+
    '<article><h3>최근 수행 기록</h3><div class="recent-list">'+data.slice(0,6).map(function(item,index){return '<div><span>'+GK.SCENARIOS[item.scenarioId].icon+'</span><p><b>'+GK.SCENARIOS[item.scenarioId].place+'</b><small>'+GK.DIFFICULTIES[item.difficulty].short+' · '+Math.round(item.timeUsed)+'초 · 구조 '+item.rescued+'</small></p><strong>'+item.safetyIndex+'</strong></div>';}).join("")+'</div></article></div>';
  }else{

function toggleVoice(v){voiceEnabled=v;}

// ===== action-mode run =====
function startRun(){
  var coarse=window.matchMedia("(pointer: coarse)").matches;
  var fresh=GK.createRun(difficulty,scenarioId);
  if(difficulty==="elementary")fresh.guidePath=GK.safetyPath(fresh);
  run=fresh;paused=coarse;
  input={up:false,down:false,left:false,right:false,axisX:0,axisY:0};
  stick={x:0,y:0};
  showTouchGuide=coarse;showMissionPanel=false;
  hud=GK.emptyHud(difficulty);
  var opening=scenario().place+" 사고 발생. 빛나는 현장 단서를 수집하고 누출원을 추리하세요.";
  message=opening;
  activeQuestion=null;feedback=null;rewindInfo=null;
  activeDeduction=false;deductionFeedback=null;deductionEvidence=[];
  result=null;
  screen="game";
  tone(392,.12,"triangle");
  if(!coarse)speak(opening);
  renderGameScreen();
  startGameLoop();
}

function detectorPulse(){
  if(screen!=="game"||paused)return;
  var r=run;if(!r||r.pulseWait>0)return;
  r.pulseWait=cfg().cooldown;r.pulseAge=0;r.pulseCount++;r.guidePath=GK.safetyPath(r);r.guideAge=cfg().pathSeconds;
  tone(430,.1,"triangle");
  var hits=0,shieldHit=false;
  var leak=GK.SCENARIOS[r.scenarioId].leak;
  if(!r.detectedLeak&&GK.distance(r.player.x,r.player.y,leak.x,leak.y)<225){
    var needed=GK.requiredEvidence(r);
    if(r.evidence.size<needed){setMessage("추리에 필요한 현장 단서가 부족합니다. 단서 "+(needed-r.evidence.size)+"개를 더 수집하세요.");tone(165,.1,"square");}
    else{deductionEvidence=Array.from(r.evidence);activeDeduction=true;deductionFeedback=null;paused=true;setMessage("증거 보드 활성화 · 수집한 단서로 실제 누출원을 판정하세요.");tone(780,.16,"triangle");renderDeductionModal();}
  }
  var sensorBoost=(1+r.knowledge.size*.08)*(1+r.completed.size*.16);
  var radiusBoost=r.knowledge.size*14;
  r.enemies.forEach(function(e){
    if(e.hp<=0)return;
    var radius=cfg().pulseRange+(e.kind==="boss"?22:0)+radiusBoost;
    if(GK.distance(r.player.x,r.player.y,e.x,e.y)<=radius){
      if(e.kind==="boss"&&r.bossBreak<5){shieldHit=true;return;}
      e.hp-=(e.kind==="boss"?cfg().damage*.72:cfg().damage)*sensorBoost;hits++;
      if(e.hp<=0){
        r.defeated++;r.score+=e.kind==="boss"?650:70;
        if(e.respawnable&&!r.completed.has("valve"))e.respawnWait=cfg().respawn;
        if(e.kind!=="boss"&&r.defeated%3===0)r.medkits++;
        GK.spawnParticles(r,e.x,e.y,e.kind==="boss"?GK.SCENARIOS[r.scenarioId].bossColor:"#ffb24d",e.kind==="boss"?42:16,reducedFx);
        GK.addShake(r,e.kind==="boss"?.6:.22,reducedFx);
      }
    }
  });
  if(shieldHit){setMessage("보스 브레이크 "+r.bossBreak+"/5 · 탐지→차단→환기→대피→신고 행동을 완성하세요.");tone(112,.13,"sawtooth");}
  if(hits){r.score+=hits*10;tone(235,.07,"square");}
  var boss=r.enemies.find(function(e){return e.kind==="boss";});
  if(boss&&boss.hp<=0)finishRun(true);
  syncHud();
}
function activateDrone(){
  var r=run;if(screen!=="game"||paused||!r||!r.detectedLeak||r.droneWait>0)return;
  r.droneWait=14;r.droneAge=5;r.score+=35;
  r.enemies.forEach(function(e){if(e.hp<=0&&e.respawnable)e.respawnWait+=4;});
  setMessage("자동 차단 드론 전개! 가스 균열의 재출현을 지연하고 위험체를 둔화합니다.");
  tone(910,.12,"square");haptic([18,25,18]);syncHud();
}
function activateShield(){
  var r=run;if(screen!=="game"||paused||!r||(r.completed.size<1&&r.rescued.size<1)||r.shieldWait>0)return;
  r.shieldWait=16;r.shieldAge=5;r.score+=30;
  setMessage("안전 보호막 전개! 5초 동안 가스·충격 피해가 크게 줄어듭니다.");
  tone(620,.16,"triangle");haptic(40);syncHud();
}
function activateVentGuide(){
  var r=run;if(screen!=="game"||paused||!r||!r.completed.has("vent")||r.ventWait>0)return;
  r.ventWait=18;r.ventAge=6;r.gasLevel=Math.max(.1,r.gasLevel-.2);r.score+=35;
  setMessage("환기 유도기 가동! 안전한 바람길이 가스를 밀어내고 위험체를 뒤로 보냅니다.");
  r.enemies.forEach(function(e){
    if(e.hp>0){
      var d=Math.max(1,GK.distance(r.player.x,r.player.y,e.x,e.y));
      e.x=GK.clamp(e.x+(e.x-r.player.x)/d*55,35,GK.WORLD.w-35);
      e.y=GK.clamp(e.y+(e.y-r.player.y)/d*55,35,GK.WORLD.h-35);
    }
  });
  tone(740,.18,"sine");haptic([20,30,30]);syncHud();
}
function activateMedkit(){
  if(screen!=="game"||paused)return;
  var r=run;if(!r||r.medkits<=0||r.player.hp>=r.player.maxHp)return;
  r.medkits--;r.player.hp=Math.min(r.player.maxHp,r.player.hp+38);
  setMessage("응급 안전키트로 보호력을 회복했습니다.");tone(720,.15,"sine");haptic([18,25,24]);syncHud();
}
function interact(){
  if(screen!=="game"||paused)return;
  var r=run;if(!r)return;
  var evidence=GK.EVIDENCE[r.scenarioId].find(function(item){return GK.distance(r.player.x,r.player.y,item.x,item.y)<68;});
  if(evidence){
    if(r.evidence.has(evidence.id)){setMessage(evidence.label+" 단서는 이미 증거 보드에 기록되었습니다.");return;}
    r.evidence.add(evidence.id);r.score+=65;
    GK.logAction(r,evidence.icon,"현장 단서 수집",evidence.label+" · "+evidence.value,"clue");
    r.guidePath=GK.safetyPath(r);r.guideAge=cfg().pathSeconds;
    var needed=GK.requiredEvidence(r),ready=r.evidence.size>=needed;
    setMessage(ready?("증거 "+r.evidence.size+"/"+needed+" 확보! 누출 의심 지점에서 탐지 펄스를 사용해 추리하세요."):(evidence.value+" · 단서 "+r.evidence.size+"/"+needed));
    tone(ready?780:610,.12,"triangle");haptic([20,20,35]);syncHud();return;
  }
  var rescue=GK.RESCUES.find(function(s){return GK.distance(r.player.x,r.player.y,s.x,s.y)<68;});
  if(rescue){
    if(r.rescued.has(rescue.id)){setMessage(rescue.label+"은 이미 안전구역으로 대피했습니다.");return;}
    if(!r.completed.has("vent")){setMessage("공급 차단과 자연환기를 먼저 완료해 안전한 대피 경로를 확보하세요.");tone(125,.1,"sawtooth");return;}
    var firstRescue=r.rescued.size===0;
    r.rescued.add(rescue.id);r.rescueMarkerAge=8;r.score+=110;r.medkits++;
    if(firstRescue){GK.awardSafetyStep(r,4,"인명 대피",rescue.tip);GK.spawnScenarioBoss(r);}
    else GK.logAction(r,rescue.icon,"추가 구조",rescue.tip,"safe");
    r.guidePath=GK.safetyPath(r);r.guideAge=cfg().pathSeconds;
    setMessage(firstRescue?(rescue.tip+" "+GK.SCENARIOS[r.scenarioId].boss+" 출현! 신고를 완료해 보호막을 파괴하세요."):(rescue.label+" 추가 대피 완료!"));
    tone(680,.14,"triangle");haptic(120);syncHud();return;
  }
  var station=GK.STATIONS.find(function(s){return GK.distance(r.player.x,r.player.y,s.x,s.y)<72;});
  var tablet=GK.TABLETS.find(function(s){return GK.distance(r.player.x,r.player.y,s.x,s.y)<72;});
  var nearby=station||tablet;
  if(!nearby){setMessage("빛나는 제단·석판 또는 구조 대상 가까이에서 상호작용하세요.");tone(150,.05,"square");return;}
  if(station&&r.completed.has(station.id)){setMessage(station.label+"은 이미 안전하게 복구되었습니다.");return;}
  if(tablet&&r.knowledge.has(tablet.id)){setMessage(tablet.label+"의 지식을 이미 기록했습니다.");return;}
  if(station&&station.id==="valve"&&!r.detectedLeak){setMessage("먼저 방폭 탐지 펄스로 정확한 누출원을 특정해야 합니다.");tone(128,.12,"sawtooth");return;}
  if(station){
    var required=station.id==="vent"?"valve":station.id==="report"?"vent":null;
    if(required&&!r.completed.has(required)){setMessage(required==="valve"?"먼저 서부 배관실의 밸브를 차단해야 합니다.":"먼저 환기 기록실의 자연 환기문을 열어야 합니다.");tone(120,.12,"sawtooth");return;}
    if(station.id==="report"&&r.rescued.size<1){setMessage("신고 전에 구조 대상을 가스가 없는 안전구역으로 대피시키세요.");tone(120,.12,"sawtooth");return;}
  }
  activeQuestion=nearby.id;feedback=null;rewindInfo=null;paused=true;tone(520,.08,"triangle");
  renderQuestionModal();
}
function answer(index){
  var r=run;if(!r||!activeQuestion||feedback)return;
  var choice=visibleChoices[index];if(!choice)return;
  if(choice.correct){
    var isMain=GK.STATIONS.some(function(s){return s.id===activeQuestion;});
    if(isMain){
      r.completed.add(activeQuestion);r.score+=180;r.player.hp=Math.min(r.player.maxHp,r.player.hp+8);
      if(activeQuestion==="valve"){r.enemies.forEach(function(e){if(e.kind!=="boss")e.respawnable=false;});r.score+=120;GK.awardSafetyStep(r,2,"공급 차단",choice.feedback);}
      if(activeQuestion==="vent"){r.gasLevel=Math.min(r.gasLevel,.72);GK.awardSafetyStep(r,3,"자연환기",choice.feedback);}
      if(activeQuestion==="report"){GK.awardSafetyStep(r,5,"안전 신고",choice.feedback);GK.spawnScenarioBoss(r);}
    }else{
      r.knowledge.add(activeQuestion);r.score+=145;r.player.hp=Math.min(r.player.maxHp,r.player.hp+5);
      GK.logAction(r,"📜","안전지식 해독",choice.feedback,"clue");
    }
    r.guidePath=GK.safetyPath(r);r.guideAge=cfg().pathSeconds;
    var cq=currentQuestion();
    feedback={correct:true,text:choice.feedback,note:(cq&&cq.correctNote)||GK.QUESTIONS[activeQuestion].correctNote};
    tone(784,.16,"triangle");
    GK.spawnParticles(r,r.player.x,r.player.y-20,"#f0d27b",22,reducedFx);
    rewindInfo=null;
    haptic(activeQuestion==="valve"?180:[24,30,24]);
  }else{
    r.wrongChoices++;r.lastMistake=choice.label;
    var rewind=GK.rewindExplanation(choice,difficulty),electrical=rewind.hazard==="spark";
    if(electrical){r.sparkHits++;r.sparkBurst=1.25;r.hitFlash=1;r.player.hp=Math.max(1,r.player.hp-cfg().wrongDamage*1.35);}
    else r.player.hp=Math.max(1,r.player.hp-cfg().wrongDamage);
    r.score=Math.max(0,r.score-(electrical?70:40));
    GK.breakSafetyChain(r,"위험 행동",choice.label+" → "+rewind.result);
    var cq2=currentQuestion();
    feedback={correct:false,text:choice.feedback,note:(cq2&&cq2.correctNote)||GK.QUESTIONS[activeQuestion].correctNote};
    rewindInfo={choice:choice.label,cause:rewind.cause,result:rewind.result,hazard:rewind.hazard};
    recordMistake(activeQuestion);
    tone(108,.18,"sawtooth");haptic([45,35,45,35,110]);
  }
  syncHud();renderQuestionModal();
}
function closeQuestion(){
  if(!feedback)return;
  if(feedback.correct){
    var r=run;
    var all=r&&r.completed.size===3;
    var lore=activeQuestion?GK.TABLETS.some(function(t){return t.id===activeQuestion;}):false;
    var bossMessage=(r&&r.rescued.size<1)?("구조 대상을 먼저 대피시켜 "+GK.SCENARIOS[r.scenarioId].boss+"의 보호막을 해제하세요!"):("세 안전인장이 모였습니다. 탐지 펄스로 "+(r?GK.SCENARIOS[r.scenarioId].boss:"보스")+"를 봉인하세요!");
    setMessage(lore?("지식석판을 해독했습니다. 탐지기가 LV."+(1+(r?r.knowledge.size:0))+"로 강화되었습니다!"):all?bossMessage:activeQuestion==="valve"?"공급 차단 완료! 자동 차단 드론이 해금되고 가스 균열 재출현이 멈췄습니다.":activeQuestion==="vent"?"자연환기 시작! 환기 유도기가 해금되었습니다.":"안전인장을 획득했습니다. 다음 구역으로 이동하세요.");
    activeQuestion=null;feedback=null;rewindInfo=null;paused=false;
  }else{feedback=null;rewindInfo=null;}
  renderQuestionModal();
}
function answerDeduction(index){
  var r=run;if(!r||deductionFeedback)return;
  var choice=visibleDeductionChoices[index];if(!choice)return;
  if(choice.correct){
    r.detectedLeak=true;r.score+=150;GK.awardSafetyStep(r,1,"누출원 추리",choice.feedback);
    r.guidePath=GK.safetyPath(r);r.guideAge=cfg().pathSeconds;
    deductionFeedback={correct:true,text:choice.feedback+" 누출원 좌표가 확정되었습니다."};
    tone(860,.18,"triangle");haptic([25,35,70]);
  }else{
    r.wrongChoices++;r.lastMistake=choice.label;r.gasLevel=Math.min(1.48,r.gasLevel+.12);
    r.player.hp=Math.max(1,r.player.hp-cfg().wrongDamage*.6);
    GK.breakSafetyChain(r,"추리 오류",choice.feedback);
    deductionFeedback={correct:false,text:choice.feedback+" 증거를 다시 연결해 판정하세요."};
    tone(112,.16,"sawtooth");haptic([45,30,75]);
  }
  syncHud();renderDeductionModal();
}
function closeDeduction(){
  if(!deductionFeedback)return;
  if(deductionFeedback.correct){
    activeDeduction=false;deductionFeedback=null;paused=false;
    setMessage("SAFE ×1 · 누출원 추리 성공! 전기·화기 조작 없이 차단 밸브로 이동하세요.");
    speak("누출원 추리 성공. 전기기구 조작 금지. 차단 밸브로 이동하세요.");
  }else{deductionFeedback=null;}
  renderDeductionModal();
}
function resolveCrisis(index){
  var r=run;if(!r||!r.crisisActive)return;
  var choice=visibleCrisisChoices[index];if(!choice)return;
  r.crisisActive=false;r.crisisHandled=true;
  if(choice.correct){
    r.crisisSuccess=true;var bonus=140+Math.ceil(r.crisisTimer)*20;r.score+=Math.round(bonus*(1+r.safeChain*.18));
    GK.logAction(r,"⏱","골든타임 세이브",choice.feedback+" · +"+bonus+"점","safe");
    setMessage("GOLDEN SAVE! "+choice.feedback);tone(940,.2,"triangle");haptic([25,25,90]);
  }else{
    r.wrongChoices++;r.lastMistake=choice.label;r.gasLevel=Math.min(1.48,r.gasLevel+.16);

    setMessage("위기 결과: "+choice.feedback);tone(96,.18,"sawtooth");haptic([60,35,100]);

function finishRun(victory){
  var r=run;if(!r||r.finished)return;r.finished=true;paused=true;
  var timeBonus=victory?Math.round(r.seconds*3):0;
  var hpBonus=victory?Math.round(Math.max(0,r.player.hp)*2):0;
  var final=Math.max(0,Math.round(r.score+timeBonus+hpBonus));
  var timeUsed=cfg().time-Math.max(0,r.seconds);
  var safetyJudgment=GK.clamp(Math.round(100-r.wrongChoices*18-r.sparkHits*5),0,100);
  var goldenTime=GK.clamp(Math.round(victory?72+r.seconds/cfg().time*28:34-r.gasExposure),0,100);
  var rescueScore=Math.round(r.rescued.size/GK.RESCUES.length*100);
  var knowledgeScore=Math.round((r.completed.size/3*.72+r.knowledge.size/GK.TABLETS.length*.28)*100);
  var safetyIndex=Math.round(safetyJudgment*.4+goldenTime*.25+rescueScore*.2+knowledgeScore*.15);
  GK.logAction(r,victory?"👑":"📜",victory?"임무 완수":"임무 종료",victory?(GK.SCENARIOS[r.scenarioId].boss+" 봉인 성공"):"골든타임 안에 임무를 완수하지 못함",victory?"safe":"danger");
  var report={victory:victory,score:final,timeUsed:timeUsed,hp:Math.max(0,Math.round(r.player.hp)),seals:r.completed.size,defeated:r.defeated,knowledge:r.knowledge.size,rescued:r.rescued.size,scenarioId:r.scenarioId,difficulty:difficulty,safetyJudgment:safetyJudgment,goldenTime:goldenTime,rescueScore:rescueScore,knowledgeScore:knowledgeScore,safetyIndex:safetyIndex,wrongChoices:r.wrongChoices,sparkHits:r.sparkHits,gasExposure:r.gasExposure,pulseCount:r.pulseCount,lastMistake:r.lastMistake,coopActions:0,createdAt:new Date().toISOString(),timeline:r.actionLog.slice(),maxCombo:r.maxSafeChain,evidenceCount:r.evidence.size,crisisSuccess:r.crisisSuccess,crisisHandled:r.crisisHandled};
  result=report;sessionReports.push(report);saveMission(report);
  tone(victory?659:130,.28,victory?"triangle":"sawtooth");
  stopGameLoop();
  setTimeout(function(){screen="result";modalRoot.innerHTML="";renderResult();},350);
}

        '<button onclick="G.closeReviewItem()">'+(reviewFeedback.correct?"다음 문제":"다시 풀기")+'</button></div>'

    '<button class="plain-button" onclick="G.resetToTitle()">복습 중단하고 처음으로</button>'+

function wireGameControls(){
  var base=document.getElementById("joystick-base");
  if(base){
    base.onpointerdown=startJoystick;base.onpointermove=moveJoystick;
    base.onpointerup=stopJoystick;base.onpointercancel=stopJoystick;base.onlostpointercapture=stopJoystick;
  }
  var pulseBtn=document.getElementById("pulse-btn");
  if(pulseBtn){
    pulseBtn.onpointerdown=startPulseHold;pulseBtn.onpointerup=stopPulseHold;
    pulseBtn.onpointercancel=stopPulseHold;pulseBtn.onlostpointercapture=stopPulseHold;
  }
  var interactBtn=document.getElementById("interact-btn");
  if(interactBtn)interactBtn.onpointerdown=function(){haptic(18);interact();};
  var medkitBtn=document.getElementById("medkit-btn");
  if(medkitBtn)medkitBtn.onpointerdown=function(){haptic([18,35,22]);activateMedkit();};
}
function moveJoystick(event){
  if(joystickPointerId!==event.pointerId)return;
  var base=event.currentTarget,rect=base.getBoundingClientRect();
  var cx=rect.left+rect.width/2,cy=rect.top+rect.height/2,max=rect.width*.3;
  var rawX=event.clientX-cx,rawY=event.clientY-cy,length=Math.hypot(rawX,rawY),scale=length>max?max/length:1;
  var x=rawX*scale,y=rawY*scale;
  stick={x:x,y:y};
  var knob=document.getElementById("joystick-knob");if(knob)knob.style.transform="translate("+x+"px,"+y+"px)";
  var nx=x/max,ny=y/max;
  input.axisX=Math.abs(nx)<.08?0:nx;input.axisY=Math.abs(ny)<.08?0:ny;
}
function startJoystick(event){
  event.preventDefault();joystickPointerId=event.pointerId;
  try{event.currentTarget.setPointerCapture(event.pointerId);}catch(e){}
  haptic(10);moveJoystick(event);
}
function stopJoystick(event){
  if(event&&joystickPointerId!==event.pointerId)return;
  joystickPointerId=null;input.axisX=0;input.axisY=0;stick={x:0,y:0};
  var knob=document.getElementById("joystick-knob");if(knob)knob.style.transform="translate(0px,0px)";
}
function startPulseHold(event){
  event.preventDefault();
  try{event.currentTarget.setPointerCapture(event.pointerId);}catch(e){}
  haptic([12,25,12]);detectorPulse();stopPulseHold();
  pulseTimer=setInterval(detectorPulse,120);
}
function stopPulseHold(){if(pulseTimer){clearInterval(pulseTimer);pulseTimer=null;}}

  var pulseBtn=document.getElementById("pulse-btn");if(pulseBtn)pulseBtn.style.setProperty("--charge",(hud.pulseReady*360)+"deg");

      '</div><button onclick="G.'+(isStory?"storyCloseQuestion":"closeQuestion")+'()">'+(feedback.correct?(isLore?"기록 완료":"행동 완료"):"5초 전으로 · 다시 판단")+'</button></div>';

// ===== story mode (no combat, no timer) =====
function startStoryRun(){
  storyStep=1;storyWrong=0;storySparkHits=0;storyStartedAt=Date.now();
  deductionEvidence=GK.EVIDENCE[scenarioId].map(function(item){return item.id;});
  activeDeduction=true;deductionFeedback=null;
  activeQuestion=null;feedback=null;rewindInfo=null;result=null;
  message=scenario().place+" 사고 기록을 검토하고 있습니다. 시간 압박 없이 차근차근 판단하세요.";
  screen="story";tone(392,.12,"triangle");
  renderStory();renderDeductionModal();
}
function storyAnswerDeduction(index){
  if(deductionFeedback)return;
  var choice=visibleDeductionChoices[index];if(!choice)return;
  if(choice.correct){deductionFeedback={correct:true,text:choice.feedback};tone(860,.18,"triangle");}
  else{storyWrong++;deductionFeedback={correct:false,text:choice.feedback};tone(112,.16,"sawtooth");}
  renderDeductionModal();
}
function storyCloseDeduction(){
  if(!deductionFeedback)return;
  if(!deductionFeedback.correct){deductionFeedback=null;renderDeductionModal();return;}
  activeDeduction=false;deductionFeedback=null;storyStep=2;activeQuestion="valve";feedback=null;rewindInfo=null;
  setMessage("추리 성공! 전기·화기 조작 없이 차단 밸브부터 순서대로 판단하세요.");
  renderStory();renderDeductionModal();renderQuestionModal();
}
function storyAnswer(index){
  if(feedback)return;
  var choice=visibleChoices[index];if(!choice)return;
  var cq=currentQuestion();
  if(choice.correct){feedback={correct:true,text:choice.feedback,note:(cq&&cq.correctNote)||""};tone(784,.16,"triangle");}
  else{
    storyWrong++;var rewind=GK.rewindExplanation(choice,difficulty);
    if(rewind.hazard==="spark")storySparkHits++;
    feedback={correct:false,text:choice.feedback,note:(cq&&cq.correctNote)||""};
    if(activeQuestion)recordMistake(activeQuestion);
    tone(108,.18,"sawtooth");
  }
  renderQuestionModal();
}
function storyCloseQuestion(){
  if(!feedback)return;
  if(!feedback.correct){feedback=null;renderQuestionModal();return;}
  feedback=null;rewindInfo=null;
  var order=["valve","vent","report"];
  var currentIndex=activeQuestion?order.indexOf(activeQuestion):-1;
  var next=order[currentIndex+1];
  if(next){activeQuestion=next;var s=GK.STATIONS.find(function(st){return st.id===next;});setMessage((s?s.label:"")+" 판단으로 이동합니다.");}
  else{activeQuestion=null;storyStep=5;setMessage("마지막으로 5초 위기 상황을 판단해 보세요. 시간 제한은 없습니다.");}
  renderStory();renderQuestionModal();
}
function storyResolveCrisis(index){
  var choice=visibleCrisisChoices[index];if(!choice)return;
  var wrong=choice.correct?storyWrong:storyWrong+1;
  var sparkHits=(!choice.correct&&choice.hazard==="spark")?storySparkHits+1:storySparkHits;
  storyStep=6;storyWrong=wrong;storySparkHits=sparkHits;
  var elapsed=storyStartedAt?Math.round((Date.now()-storyStartedAt)/1000):0;
  var safetyJudgment=GK.clamp(Math.round(100-wrong*18),0,100),goldenTime=80,rescueScore=100,knowledgeScore=safetyJudgment;
  var safetyIndex=Math.round(safetyJudgment*.4+goldenTime*.25+rescueScore*.2+knowledgeScore*.15);
  var report={victory:true,score:Math.max(0,600-wrong*80),timeUsed:elapsed,hp:cfg().hp,seals:3,defeated:0,knowledge:0,rescued:1,scenarioId:scenarioId,difficulty:difficulty,safetyJudgment:safetyJudgment,goldenTime:goldenTime,rescueScore:rescueScore,knowledgeScore:knowledgeScore,safetyIndex:safetyIndex,wrongChoices:wrong,sparkHits:sparkHits,gasExposure:0,pulseCount:0,lastMistake:wrong>0?"스토리 모드 재판단":"",coopActions:0,createdAt:new Date().toISOString(),maxCombo:0,evidenceCount:GK.EVIDENCE[scenarioId].length,crisisSuccess:sparkHits===0,crisisHandled:true};
  result=report;sessionReports.push(report);saveMission(report);
  tone(choice.correct?659:130,.28,choice.correct?"triangle":"sawtooth");
  setTimeout(function(){screen="result";modalRoot.innerHTML="";renderResult();},350);
}
function renderStory(){
  var s=scenario();
  var labels=["증거·추리","차단","환기","신고","위기판단"];
  app.innerHTML='<section class="story-screen"><div class="story-card">'+
    '<span class="chapter-label">STORY MODE · '+s.place+'</span><h2>'+s.icon+' '+s.title+'</h2>'+
    '<div class="story-progress">'+labels.map(function(label,index){return '<i class="'+(index<storyStep-1?"done":index===storyStep-1?"active":"")+'">'+label+'</i>';}).join("")+'</div>'+
    '<p class="message-scroll">'+esc(message)+'</p>'+
    (storyStep===5?renderStoryCrisisHtml():'')+
    '<button class="plain-button" onclick="G.resetToTitle()">중단하고 처음으로</button>'+
  '</div></section>';
  applyLargeText();
}
function renderStoryCrisisHtml(){
  var all=GK.CRISIS_ACTIONS[scenarioId].choices,correct=all.find(function(c){return c.correct;});
  visibleCrisisChoices=[correct].concat(all.filter(function(c){return !c.correct;}).slice(0,cfg().options-1));
  return '<div class="crisis-card static"><h3>'+GK.CRISIS_ACTIONS[scenarioId].title+'</h3><p>'+GK.CRISIS_ACTIONS[scenarioId].prompt+'</p>'+
    '<div>'+visibleCrisisChoices.map(function(choice,index){return '<button onclick="G.storyResolveCrisis('+index+')"><i>'+String.fromCharCode(65+index)+'</i><b>'+choice.label+'</b></button>';}).join("")+'</div>'+
    '<small>시간 제한 없이 가장 안전한 행동을 고르세요.</small></div>';
}

      '<div class="incident-replay"><header><div><span>⏪ INCIDENT REPLAY</span><b>선택 → 원인 → 결과</b></div><em>총 '+formatTime(result.timeUsed)+'</em></header>'+
      '<div>'+result.timeline.slice(-8).map(function(item){return '<article class="'+item.outcome+'"><i>'+item.icon+'</i><small>T+'+String(Math.floor(item.at/60)).padStart(2,"0")+':'+String(item.at%60).padStart(2,"0")+'</small><b>'+item.label+'</b><p>'+item.detail+'</p></article>';}).join("")+'</div>'+
      '<footer><span class="safe">◆ 안전 행동은 보스 보호막을 파괴합니다.</span><span class="danger">⚠ 위험 행동은 실제 게임 위험으로 확대됩니다.</span></footer></div>'
    ):'')+
    '<div class="progress-report"><div><span>수호복 성장</span><b>TIER '+profile.suitTier+'</b><small>누적 XP '+profile.xp.toLocaleString()+' · 연속 성공 '+profile.streak+'</small></div><div><span>획득 안전배지</span><p>'+(profile.badges.length?profile.badges.slice(-5).map(function(item){return '<i>◆ '+item+'</i>';}).join(""):'<i>첫 임무 완료 후 배지가 기록됩니다</i>')+'</p></div></div>'+
    (teacherMode&&stats?('<div class="classroom-report"><b>체험교실 누적 분석</b><div><span>플레이 '+sessionReports.length+'회</span><span>평균 안전지수 '+stats.average+'</span><span>스파크 유발 '+stats.sparks+'회</span></div></div>'):'')+
    '<div class="safety-oath"><b>가스키퍼의 골든타임 행동순서</b><p>탐지 → 전기·화기 조작 금지 → 가능한 경우 밸브 차단 → 창문·문으로 자연환기 → 주변 대피 → 안전한 곳에서 119·가스공급자 신고</p><small>본 콘텐츠는 교육용 시뮬레이션입니다. 실제 상황에서는 119 및 한국가스안전공사(1544-4500) 안내를 따르세요.</small></div>'+
    '<div class="result-actions"><button class="plain-button" onclick="G.resetToTitle()">난이도·운영모드</button><button class="plain-button" onclick="window.print()">수호기사 인증서 인쇄</button><button class="plain-button" onclick="G.exportResultCard()">결과 카드 저장 · SNS 공유용</button><button class="gold-button compact" onclick="G.prepareBriefing()"><span>새 사고에 도전</span><b>NEXT MISSION</b></button></div>'+
  '</div></section>';
  applyLargeText();
}

// ===== game loop (ported from the online app's rAF loop) =====
function startGameLoop(){
  canvasEl=document.getElementById("world-canvas");
  if(!canvasEl)return;
  ctx2d=canvasEl.getContext("2d");if(!ctx2d)return;
  canvasDpr=Math.min(window.devicePixelRatio||1,2.5);
  lastFrame=performance.now();hudClock=0;
  syncCanvasResolution();
  rafId=requestAnimationFrame(gameLoop);
}
function stopGameLoop(){if(rafId){cancelAnimationFrame(rafId);rafId=0;}}
function syncCanvasResolution(){
  if(!canvasEl||!ctx2d)return;
  var rect=canvasEl.getBoundingClientRect();
  var w=Math.max(1,Math.round(rect.width*canvasDpr)),h=Math.max(1,Math.round(rect.height*canvasDpr));
  if(canvasEl.width!==w||canvasEl.height!==h){canvasEl.width=w;canvasEl.height=h;}
  ctx2d.setTransform(w/960,0,0,h/576,0,0);
}
function gameLoop(now){
  if(screen!=="game"){rafId=0;return;}
  var shouldContinue=true;
  try{
    shouldContinue=gameLoopStep(now);
  }catch(err){
    console.error("Gaskeeper game loop error:",err);
    setMessage("일시적인 화면 오류가 발생했습니다(F12 콘솔 참고). 자동으로 다시 시도합니다: "+(err&&err.message?err.message:String(err)));
  }
  if(shouldContinue===false){rafId=0;return;}
  rafId=requestAnimationFrame(gameLoop);
}
function gameLoopStep(now){
  syncCanvasResolution();
  var r=run;
  if(!r||r.finished)return false;
  var dt=Math.min(.034,(now-lastFrame)/1000);lastFrame=now;
  var c=cfg();
  r.sparkBurst=Math.max(0,r.sparkBurst-dt);GK.updateEffects(r,dt);
  if(!paused){
    r.seconds-=dt;r.pulseWait=Math.max(0,r.pulseWait-dt);r.pulseAge+=dt;r.guideAge=Math.max(0,r.guideAge-dt);
    r.hitFlash=Math.max(0,r.hitFlash-dt*2.4);r.trapWait=Math.max(0,r.trapWait-dt);r.alertWait=Math.max(0,r.alertWait-dt);
    r.droneWait=Math.max(0,r.droneWait-dt);r.droneAge=Math.max(0,r.droneAge-dt);
    r.shieldWait=Math.max(0,r.shieldWait-dt);r.shieldAge=Math.max(0,r.shieldAge-dt);
    r.ventWait=Math.max(0,r.ventWait-dt);r.ventAge=Math.max(0,r.ventAge-dt);
    r.eventTimer=Math.max(0,r.eventTimer-dt);r.bossPatternWait=Math.max(0,r.bossPatternWait-dt);r.rescueMarkerAge=Math.max(0,r.rescueMarkerAge-dt);
    if(r.crisisActive){
      r.crisisTimer=Math.max(0,r.crisisTimer-dt);
      if(r.crisisTimer<=0){
        r.crisisActive=false;r.crisisHandled=true;r.wrongChoices++;r.lastMistake="골든타임 판단 지연";
        r.gasLevel=Math.min(1.48,r.gasLevel+.18);r.player.hp=Math.max(1,r.player.hp-c.wrongDamage);
        GK.breakSafetyChain(r,"골든타임 초과","5초 안에 위험 행동을 차단하지 못해 사고가 확대됨");
        setMessage("골든타임 실패! 판단이 늦어 가스 농도와 위험도가 상승했습니다.");tone(88,.2,"sawtooth");haptic([80,40,120]);
        renderCrisisModal();
      }
    }
    var leakGrowth=c.gasGrowth*(r.scenarioId==="camping"?1.25:r.scenarioId==="restaurant"?1.12:1);
    if(!r.completed.has("valve"))r.gasLevel=Math.min(1.48,r.gasLevel+dt*leakGrowth);
    else if(!r.completed.has("vent"))r.gasLevel=Math.max(.7,r.gasLevel-dt*.035);
    else r.gasLevel=Math.max(.12,r.gasLevel-dt*(r.ventAge>0?.62:.38));
    if(r.scenarioId==="camping"&&!r.completed.has("valve"))r.overheat=Math.min(92,r.overheat+dt*.36);
    var elapsed=c.time-r.seconds;
    if(r.eventCount<c.events&&r.eventTimer<=0&&elapsed>=r.nextEventAt){
      var eventIndex=r.eventCount;r.eventCount++;r.eventTriggered=true;r.eventTimer=difficulty==="high"?10:9;r.nextEventAt+=c.eventGap;
      if(eventIndex===0&&r.scenarioId==="laboratory"){r.eventType="sensor";r.eventLabel="센서 03 통신 두절 · 현장 표지로 이동";}
      else if(eventIndex===0&&r.scenarioId==="restaurant"){r.eventType="shift";r.eventLabel="LPG 저류 방향 변경 · 낮은 통로 주의";r.gasLevel=Math.min(1.48,r.gasLevel+.18);}
      else if(eventIndex===0&&r.scenarioId==="camping"){r.eventType="spark";r.eventLabel="부탄캔 과열 경보 · 즉시 거리 확보";r.sparkBurst=difficulty==="elementary"?1.25:2.2;}
      else if(eventIndex===0){r.eventType="rift";r.eventLabel="후드 센서 단선 · 신규 가스 균열";r.enemies.push({id:"event-rift-"+eventIndex,x:610,y:450,spawnX:610,spawnY:450,hp:c.enemyHp,maxHp:c.enemyHp,kind:"wisp",phase:3.1,hitWait:0,respawnWait:0,respawnable:!r.completed.has("valve")});}
      else if(eventIndex===1){r.eventType="block";r.eventLabel="방화셔터 오작동 · 중앙 통로 10초 폐쇄";r.gasLevel=Math.min(1.48,r.gasLevel+.12);}
      else{
        r.eventType="rift";r.eventLabel="연쇄 가스 균열 · 위험체와 스파크 동시 발생";r.sparkBurst=1.5;
        for(var si=0;si<2;si++)r.enemies.push({id:"surge-"+Date.now()+"-"+si,x:790+si*82,y:520+si*70,spawnX:790+si*82,spawnY:520+si*70,hp:c.enemyHp*.8,maxHp:c.enemyHp*.8,kind:si?"crawler":"wisp",phase:4+si,hitWait:.8,respawnWait:0,respawnable:false});
      }
      if(eventIndex===0&&!r.crisisHandled){r.crisisActive=true;r.crisisTimer=5;renderCrisisModal();}
      setMessage("돌발상황 "+r.eventCount+"/"+c.events+": "+r.eventLabel);speak("돌발 상황. "+r.eventLabel);haptic([70,50,70]);
    }
    if(r.seconds<=0){r.seconds=0;finishRun(false);return false;}
    var dx=(input.right?1:0)-(input.left?1:0)+input.axisX,dy=(input.down?1:0)-(input.up?1:0)+input.axisY;
    r.player.moving=!!(dx||dy);
    if(dx||dy){
      var len=Math.hypot(dx,dy);dx/=len;dy/=len;r.player.facingX=dx;r.player.facingY=dy;
      var activePoolsNow=GK.SCENARIOS[r.scenarioId].poolIndices.map(function(index){return GK.GAS_POOLS[index];});
      var floorSlow=(r.scenarioId==="restaurant"&&activePoolsNow.some(function(pool){return GK.distance(r.player.x,r.player.y,pool.x,pool.y)<pool.r*r.gasLevel*.9;}))?.76:1;
      var speed=c.playerSpeed*floorSlow;
      var nx=r.player.x+dx*speed*dt,ny=r.player.y+dy*speed*dt;
      if(!GK.blocked(nx,r.player.y)&&!GK.dynamicBlocked(r,nx,r.player.y))r.player.x=nx;
      if(!GK.blocked(r.player.x,ny)&&!GK.dynamicBlocked(r,r.player.x,ny))r.player.y=ny;
    }
    GK.CACHES.forEach(function(cache){
      if(!r.caches.has(cache.id)&&GK.distance(r.player.x,r.player.y,cache.x,cache.y)<32){
        r.caches.add(cache.id);r.medkits++;r.score+=75;
        setMessage(cache.label+" 발견! 안전키트 1개와 보너스 점수를 획득했습니다.");tone(760,.12,"triangle");
      }
    });
    var activePools=GK.SCENARIOS[r.scenarioId].poolIndices.map(function(index){return GK.GAS_POOLS[index];});
    var poolFactor=r.scenarioId==="restaurant"?.94:.72;
    var inGas=r.gasLevel>.2&&activePools.some(function(pool){return GK.distance(r.player.x,r.player.y,pool.x,pool.y)<pool.r*r.gasLevel*poolFactor;});
    if(inGas)r.gasExposure+=dt;
    var sparkHit=GK.SPARK_TRAPS.some(function(trap){return (r.sparkBurst>0||((now/1000*c.trapTempo+trap.phase)%4)<c.trapWindow)&&GK.distance(r.player.x,r.player.y,trap.x,trap.y)<c.trapRadius;});
    if(r.trapWait<=0&&(inGas||sparkHit)){
      r.trapWait=.9;var guard=r.shieldAge>0?.28:1;
      r.player.hp-=(sparkHit?c.touchDamage*.8:c.touchDamage*.48)*guard;r.hitFlash=.72;
      GK.addShake(r,sparkHit?.45:.2,reducedFx);
      GK.spawnParticles(r,r.player.x,r.player.y,sparkHit?"#ffcf5c":GK.SCENARIOS[r.scenarioId].color,sparkHit?18:10,reducedFx);
      setMessage(sparkHit?"대형 점화 스파크 함정! 주황색 예고 링이 사라진 뒤 통과하세요.":"바닥에 고인 가스에 노출되었습니다. 자연 환기문을 서둘러 개방하세요.");
      tone(sparkHit?118:82,.09,"sawtooth");if(sparkHit)haptic([35,25,65]);
    }
    if(r.alertWait<=0){
      var leak=GK.SCENARIOS[r.scenarioId].leak,leakDistance=GK.distance(r.player.x,r.player.y,leak.x,leak.y);
      var nearest=r.enemies.filter(function(e){return e.hp>0;}).sort(function(a,b){return GK.distance(r.player.x,r.player.y,a.x,a.y)-GK.distance(r.player.x,r.player.y,b.x,b.y);})[0];
      if(!r.detectedLeak&&leakDistance<430){tone(360+GK.clamp(430-leakDistance,0,390)*1.4,.045,"square",GK.clamp((leak.x-r.player.x)/350,-1,1));r.alertWait=GK.clamp(leakDistance/170,.28,1.35);}
      else if(nearest&&GK.distance(r.player.x,r.player.y,nearest.x,nearest.y)<220){tone(145,.045,"sine",GK.clamp((nearest.x-r.player.x)/180,-1,1));r.alertWait=1.3;}
      else{
        var target=GK.objectiveTarget(r);
        if(GK.distance(r.player.x,r.player.y,target.x,target.y)>520){setMessage("관제 안내: 화면 가장자리의 황금 화살표와 미니맵 NEXT 표식을 따라가세요.");if(difficulty==="elementary")speak("탐지 펄스를 누르면 초록 안전 길이 나타납니다.");}
        r.alertWait=7;
      }
    }
    r.enemies.forEach(function(e){
      if(e.hp<=0){
        if(e.respawnable&&!r.completed.has("valve")){
          e.respawnWait=Math.max(0,e.respawnWait-dt);
          if(e.respawnWait<=0&&GK.distance(r.player.x,r.player.y,e.spawnX,e.spawnY)>105){
            e.x=e.spawnX;e.y=e.spawnY;e.hp=e.maxHp;e.hitWait=.9;e.phase+=.71;r.respawned++;
            setMessage("누출원이 열려 가스 균열이 다시 나타났습니다! 차단 밸브를 서두르세요.");tone(168,.12,"sawtooth");
          }
        }
        return;
      }
      e.hitWait=Math.max(0,e.hitWait-dt);
      var d=GK.distance(e.x,e.y,r.player.x,r.player.y);
      var aggro=e.kind==="boss"?c.aggro+220:c.aggro;
      if(d<aggro&&d>24){
        var droneSlow=r.droneAge>0?.48:1,speed2=c.enemySpeed*(e.kind==="boss"?.78:e.kind==="crawler"?1.12:1)*droneSlow;
        var ex=e.x+(r.player.x-e.x)/d*speed2*dt,ey=e.y+(r.player.y-e.y)/d*speed2*dt;
        if(!GK.blocked(ex,e.y,e.kind==="boss"?26:14))e.x=ex;
        if(!GK.blocked(e.x,ey,e.kind==="boss"?26:14))e.y=ey;
      }
      var hitRange=e.kind==="boss"?48:28;
      if(d<hitRange&&e.hitWait<=0){
        e.hitWait=e.kind==="boss"?.72:1.05;var guard2=r.shieldAge>0?.28:1;
        r.player.hp-=c.touchDamage*(e.kind==="boss"?1.65:1)*guard2;r.hitFlash=1;
        GK.addShake(r,e.kind==="boss"?.7:.35,reducedFx);
        GK.spawnParticles(r,r.player.x,r.player.y,"#ff5a52",e.kind==="boss"?26:14,reducedFx);
        setMessage(e.kind==="boss"?(GK.SCENARIOS[r.scenarioId].boss+"의 충격! 거리를 벌리고 탐지 펄스를 사용하세요."):"가스 망령에게 노출되었습니다. 거리를 확보하세요.");
        tone(92,.07,"sawtooth",GK.clamp((e.x-r.player.x)/150,-1,1));
        if(r.player.hp<=0){r.player.hp=0;finishRun(false);}
      }
    });
    var boss=r.enemies.find(function(e){return e.kind==="boss"&&e.hp>0;});
    if(boss&&r.bossPatternWait<=0){
      r.bossPatternWait=c.bossCadence*(r.scenarioId==="camping"?.88:1);
      if(r.scenarioId==="kitchen"){
        var bd=GK.distance(boss.x,boss.y,r.player.x,r.player.y);
        if(bd>88&&bd<190){r.player.hp-=c.touchDamage*(r.shieldAge>0?.22:.72);r.hitFlash=.8;}
        setMessage("역화 고리 확산! 보스에게 너무 가깝거나 멀리 서지 마세요.");
      }else if(r.scenarioId==="restaurant"){r.gasLevel=Math.min(1.48,r.gasLevel+.1);setMessage("저류층 포식자가 바닥으로 LPG 안개를 퍼뜨립니다.");}
      else if(r.scenarioId==="camping"){r.sparkBurst=1.35;setMessage("블레이즈의 과열 폭발! 주황 예고 링 밖으로 이동하세요.");haptic([60,30,80]);}
      else{
        for(var bi=0;bi<c.bossSummons;bi++)r.enemies.push({id:"code-"+Date.now()+"-"+bi,x:boss.x+(bi-(c.bossSummons-1)/2)*72,y:boss.y+(bi%2?60:-60),spawnX:boss.x,spawnY:boss.y,hp:c.enemyHp*.55,maxHp:c.enemyHp*.55,kind:bi%2?"crawler":"wisp",phase:bi,hitWait:.7,respawnWait:0,respawnable:false});
        setMessage("오류코드 키메라가 잘못된 센서 신호 "+c.bossSummons+"개를 소환했습니다.");
      }
      tone(86,.16,"sawtooth");
    }
    if(boss&&!r.bossPhase2&&boss.hp/boss.maxHp<.5){
      r.bossPhase2=true;var summonCount=c.bossSummons;
      for(var pi=0;pi<summonCount;pi++)r.enemies.push({id:"phase-wisp-"+pi,x:boss.x+(pi-(summonCount-1)/2)*90,y:boss.y+(pi%2?-60:60),spawnX:boss.x,spawnY:boss.y,hp:c.enemyHp,maxHp:c.enemyHp,kind:pi%2?"crawler":"wisp",phase:1.2+pi,hitWait:0,respawnWait:0,respawnable:false});
      setMessage(GK.SCENARIOS[r.scenarioId].boss+" 2단계! "+GK.DIFFICULTIES[difficulty].short+" 난이도 위험체 "+summonCount+"기 증원.");tone(74,.2,"sawtooth");
    }
    if(r.player.hp<=0){r.player.hp=0;finishRun(false);return false;}
    hudClock+=dt;if(hudClock>.11){hudClock=0;syncHud();}
  }
  GK.drawWorld(ctx2d,r,now/1000,reducedFx,difficulty,profile.suitTier);
  return true;
}

// ===== keyboard input =====
window.addEventListener("keydown",function(event){
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].indexOf(event.code)!==-1)event.preventDefault();
  if(event.code==="ArrowUp"||event.code==="KeyW")input.up=true;
  if(event.code==="ArrowDown"||event.code==="KeyS")input.down=true;
  if(event.code==="ArrowLeft"||event.code==="KeyA")input.left=true;
  if(event.code==="ArrowRight"||event.code==="KeyD")input.right=true;
  if(!event.repeat&&event.code==="Space")detectorPulse();
  if(!event.repeat&&event.code==="KeyE")interact();
  if(!event.repeat&&event.code==="KeyQ")activateMedkit();
  if(!event.repeat&&event.code==="Digit1")activateDrone();
  if(!event.repeat&&event.code==="Digit2")activateShield();
  if(!event.repeat&&event.code==="Digit3")activateVentGuide();
},{passive:false});
window.addEventListener("keyup",function(event){
  if(event.code==="ArrowUp"||event.code==="KeyW")input.up=false;
  if(event.code==="ArrowDown"||event.code==="KeyS")input.down=false;
  if(event.code==="ArrowLeft"||event.code==="KeyA")input.left=false;
  if(event.code==="ArrowRight"||event.code==="KeyD")input.right=false;
});
window.addEventListener("blur",function(){input={up:false,down:false,left:false,right:false,axisX:0,axisY:0};joystickPointerId=null;});

window.G={
  pickDifficulty:pickDifficulty,pickScenarioChoice:pickScenarioChoice,toggleTeacherMode:toggleTeacherMode,setExperienceMode:setExperienceMode,
  openDashboard:openDashboard,closeDashboard:closeDashboard,exportCsv:exportCsv,resetDashboard:resetDashboard,
  prepareBriefing:prepareBriefing,renderTitle:renderTitle,toggleVoice:toggleVoice,toggleReducedFx:toggleReducedFx,toggleLargeText:toggleLargeText,
  startRun:startRun,startStoryRun:startStoryRun,detectorPulse:detectorPulse,activateDrone:activateDrone,activateShield:activateShield,activateVentGuide:activateVentGuide,activateMedkit:activateMedkit,
  interact:interact,answer:answer,closeQuestion:closeQuestion,answerDeduction:answerDeduction,closeDeduction:closeDeduction,resolveCrisis:resolveCrisis,
  storyAnswerDeduction:storyAnswerDeduction,storyCloseDeduction:storyCloseDeduction,storyAnswer:storyAnswer,storyCloseQuestion:storyCloseQuestion,storyResolveCrisis:storyResolveCrisis,
  resetToTitle:resetToTitle,toggleMissionPanel:toggleMissionPanel,toggleLeftHanded:toggleLeftHanded,toggleFullscreen:toggleFullscreen,dismissTouchGuide:dismissTouchGuide,
  exportResultCard:exportResultCard,
  dismissReviewBanner:dismissReviewBanner,startReview:startReview,reviewAnswer:reviewAnswer,closeReviewItem:closeReviewItem,
  __debugLoop:gameLoop,__debugState:function(){return {screen:screen,paused:paused,run:run};}
};

renderTitle();
})();
