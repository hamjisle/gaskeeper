<script>
const CFG={elementary:{label:'초등학생',icon:'🌱',tag:'탐험 입문',time:180,hp:120,enemies:4,eHp:38,eSpeed:42,damage:30,touch:7,opts:2,wrong:5,boss:150,cd:.54},middle:{label:'중학생',icon:'🛡️',tag:'현장 실전',time:150,hp:100,enemies:6,eHp:48,eSpeed:52,damage:27,touch:10,opts:3,wrong:10,boss:210,cd:.64},high:{label:'고등학생',icon:'⚡',tag:'심연 도전',time:120,hp:85,enemies:8,eHp:58,eSpeed:62,damage:24,touch:13,opts:4,wrong:15,boss:285,cd:.74}};
const SCN={

function pulse(){if(!run||paused||run.pwait>0)return;const c=CFG[diff];run.pwait=c.cd;run.page=0;tone(430,.1,'triangle');let hit=0;run.e.forEach(e=>{if(e.hp<=0)return;if(dist(run.p.x,run.p.y,e.x,e.y)<=(e.kind==='boss'?154:132)){e.hp-=e.kind==='boss'?c.damage*.72:c.damage;hit++;if(e.hp<=0){run.kills++;run.score+=e.kind==='boss'?650:70;if(e.kind!=='boss'&&run.kills%3===0)run.kits++}}});if(hit){run.score+=hit*10;tone(235,.07,'square')}const boss=run.e.find(e=>e.kind==='boss');if(boss&&boss.hp<=0)finish(1);sync()}
function heal(){if(!run||paused||run.kits<1||run.p.hp>=run.p.max)return;run.kits--;run.p.hp=Math.min(run.p.max,run.p.hp+38);message('응급 안전키트로 보호력을 회복했습니다.');tone(720,.15);sync()}
function interact(){if(!run||paused)return;const s=S.find(s=>dist(run.p.x,run.p.y,s.x,s.y)<72);if(!s){message('빛나는 안전 제단 가까이에서 작동하세요.');return}if(run.done.has(s.id)){message(s.label+'은 이미 복구되었습니다.');return}const req=s.id==='vent'?'valve':s.id==='report'?'vent':null;if(req&&!run.done.has(req)){message(req==='valve'?'먼저 서쪽 배관실의 밸브를 차단하세요.':'먼저 중앙 기록실의 자연 환기문을 여세요.');return}active=s.id;answerState=null;paused=true;renderQuestion()}
function options(){const all=questFor(active).c,ok=all.find(x=>x[3]);return[ok,...all.filter(x=>!x[3]).slice(0,CFG[diff].opts-1)].sort((a,b)=>a[4]-b[4])}
function renderQuestion(){let old=$('qmodal');if(old)old.remove();const q=questFor(active),m=document.createElement('div');m.id='qmodal';m.className='modal';m.innerHTML=`<div class="qcard"><span class="chapter">SAFETY SEAL</span><h2>${q.title}</h2><p>${q.prompt}</p><div class="opts">${options().map((o,i)=>`<button ${answerState?'disabled':''} class="${answerState?(o[3]?'correct':'muted'):''}" onclick="choose('${o[0]}')"><i>${String.fromCharCode(65+i)}</i><b>${o[1]}</b></button>`).join('')}</div>${answerState?`<div class="feedback ${answerState.ok?'safe':'bad'}"><span>${answerState.ok?'◆':'⚠'}</span><div><b>${answerState.ok?'안전인장이 반응합니다':'봉인이 거부되었습니다'}</b><p>${answerState.text}</p><small>${q.note}</small></div><button onclick="nextAnswer()">${answerState.ok?'인장 획득':'다시 판단'}</button></div>`:''}</div>`;document.body.appendChild(m)}
function choose(id){if(answerState)return;const o=questFor(active).c.find(x=>x[0]===id),c=CFG[diff];if(o[3]){run.done.add(active);run.score+=180;run.p.hp=Math.min(run.p.max,run.p.hp+8);answerState={ok:1,text:o[2]};tone(784,.16,'triangle');if(run.done.size===3&&!run.boss){run.boss=1;run.score+=200;run.e.push({id:'boss',x:500,y:448,kind:'boss',hp:c.boss,max:c.boss,phase:0,wait:0})}}else{run.p.hp=Math.max(1,run.p.hp-c.wrong);run.score=Math.max(0,run.score-40);answerState={ok:0,text:o[2]};tone(108,.18,'sawtooth')}sync();renderQuestion()}
function nextAnswer(){if(answerState.ok){$('qmodal').remove();message(run.done.size===3?'세 안전인장이 모였습니다. 중앙 제단의 폭압 군주를 봉인하세요!':'안전인장을 획득했습니다. 다음 구역으로 이동하세요.');active=null;answerState=null;paused=false}else{answerState=null;renderQuestion()}}
function finish(win){if(!run||run.finish)return;run.finish=1;paused=true;const c=CFG[diff],score=Math.max(0,Math.round(run.score+(win?run.sec*3+Math.max(0,run.p.hp)*2:0))),used=c.time-Math.max(0,run.sec),rank=win?(score>=1450?['👑','최정예 가스키퍼','누출의 심연을 완벽하게 봉인했습니다.']:['🛡️','가스안전 수호기사','세 안전인장을 되찾고 현장을 지켰습니다.']):['📜','현장 견습기사','수집한 기록을 바탕으로 다시 심연에 도전하세요.'];tone(win?659:130,.28,win?'triangle':'sawtooth');setTimeout(()=>{app.innerHTML=`<section class="result"><div class="resultcard"><div class="sigil">${rank[0]}</div><span class="chapter">MISSION REPORT</span><h1>${rank[1]}</h1><p>${rank[2]}</p><div class="score"><small>FINAL SCORE</small><b>${score.toLocaleString()}</b></div><div class="stats"><div><b>${run.done.size} / 3</b><small>안전인장</small></div><div><b>${run.kills}</b><small>정화한 위험체</small></div><div><b>${fmt(used)}</b><small>임무 시간</small></div><div><b>${Math.round(Math.max(0,run.p.hp))}</b><small>남은 보호력</small></div></div><div class="oath"><b>가스키퍼의 네 가지 서약</b><br>전기·화기 조작 금지 → 가능한 경우 밸브 잠금 → 창문·문으로 자연 환기 → 밖에서 119·가스공급자 신고</div><div class="actions"><button class="plain" onclick="intro()">난이도 선택</button><button class="plain" onclick="window.print()">보고서 인쇄</button><button class="gold" onclick="start()"><span>다시 심연으로</span><small>REPLAY</small></button></div></div></section>`},300)}
function wall(ctx,o){ctx.fillStyle='#272a2e';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='#0a0b0d';ctx.lineWidth=2;for(let y=o.y;y<o.y+o.h;y+=28){for(let x=o.x-((y-o.y)/28%2?14:0);x<o.x+o.w;x+=28)ctx.strokeRect(x,y,28,28)}ctx.fillStyle='#ffffff0d';ctx.fillRect(o.x,o.y,o.w,3)}
function station(ctx,s,done,t){ctx.save();ctx.translate(s.x,s.y);const p=1+Math.sin(t*3)*.08;ctx.scale(p,p);ctx.shadowColor=done?'#67e2a8':s.color;ctx.shadowBlur=20;ctx.fillStyle=done?'#286c51':'#222932';ctx.strokeStyle=done?'#8af0bb':s.color;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-23);ctx.lineTo(22,-10);ctx.lineTo(18,18);ctx.lineTo(0,28);ctx.lineTo(-18,18);ctx.lineTo(-22,-10);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=done?'#d7ffe9':'#f7e7b2';ctx.font='bold '+(s.mark.length>2?10:16)+'px sans-serif';ctx.textAlign='center';ctx.fillText(done?'✓':s.mark,0,5);ctx.shadowBlur=0;ctx.fillStyle='#e9edf2';ctx.font='bold 10px sans-serif';ctx.fillText(s.label,0,43);ctx.restore()}
function enemy(ctx,e,t){const b=Math.sin(t*4+e.phase)*5,boss=e.kind==='boss',r=boss?45:e.kind==='crawler'?22:26;ctx.save();ctx.translate(e.x,e.y+b);const g=ctx.createRadialGradient(0,0,4,0,0,r*1.5);g.addColorStop(0,boss?'#b8444fe6':'#58b782dd');g.addColorStop(1,'#10201d00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*1.5,0,Math.PI*2);ctx.fill();ctx.fillStyle=boss?'#6f2636':e.kind==='crawler'?'#356c54':'#3c7d63';ctx.beginPath();ctx.arc(0,-5,r,Math.PI,0);ctx.quadraticCurveTo(r,18,r*.45,23);ctx.quadraticCurveTo(0,9,-r*.45,23);ctx.quadraticCurveTo(-r,17,-r,-5);ctx.fill();ctx.strokeStyle=boss?'#d88375':'#7cc9a2';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#eaffba';ctx.fillRect(-10,-8,6,4);ctx.fillRect(5,-8,6,4);ctx.fillStyle='#12161a';ctx.fillRect(-r,-r-14,r*2,5);ctx.fillStyle=boss?'#e45d5d':'#62d596';ctx.fillRect(-r,-r-14,r*2*Math.max(0,e.hp/e.max),5);ctx.restore()}
function hero(ctx,p,t){ctx.save();ctx.translate(p.x,p.y+Math.sin(t*7)*1.5);ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,17,18,7,0,0,Math.PI*2);ctx.fill();if(run.flash){ctx.shadowColor='#ff5a52';ctx.shadowBlur=reducedFx?8:22}ctx.lineWidth=3;ctx.strokeStyle='#0b1016';ctx.fillStyle='#e3b83d';ctx.beginPath();ctx.roundRect(-12,-2,24,25,7);ctx.fill();ctx.stroke();ctx.fillStyle='#f1c94a';ctx.beginPath();ctx.arc(0,-10,15,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#69d9e7';ctx.beginPath();ctx.roundRect(-10,-15,20,10,4);ctx.fill();ctx.stroke();ctx.strokeStyle='#b8eaff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(8,3);ctx.lineTo(18+p.fx*3,-12+p.fy*3);ctx.stroke();ctx.fillStyle='#73d8e7';ctx.beginPath();ctx.arc(19+p.fx*3,-14+p.fy*3,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#543f20';ctx.fillRect(-10,20,8,7);ctx.fillRect(3,20,8,7);ctx.restore()}
function draw(ctx,t){ctx.clearRect(0,0,960,576);ctx.fillStyle='#101216';ctx.fillRect(0,0,960,576);for(let y=32;y<544;y+=32)for(let x=32;x<928;x+=32){ctx.fillStyle=((x+y)/32)%2?'#191c21':'#171a1f';ctx.fillRect(x,y,32,32);ctx.strokeStyle='#76848b14';ctx.strokeRect(x+.5,y+.5,31,31)}ctx.fillStyle='#295c6f1f';ctx.fillRect(332,32,308,298);W.forEach(o=>wall(ctx,o));S.forEach(s=>station(ctx,s,run.done.has(s.id),t));run.e.filter(e=>e.hp>0).forEach(e=>enemy(ctx,e,t));if(run.page<.5){const r=28+run.page*255;ctx.strokeStyle=`rgba(99,220,238,${1-run.page*2})`;ctx.lineWidth=5;ctx.beginPath();ctx.arc(run.p.x,run.p.y,r,0,Math.PI*2);ctx.stroke()}hero(ctx,run.p,t);const sh=ctx.createRadialGradient(run.p.x,run.p.y,85,run.p.x,run.p.y,390);sh.addColorStop(0,'#02040800');sh.addColorStop(.62,'#02040824');sh.addColorStop(1,'#020408aa');ctx.fillStyle=sh;ctx.fillRect(0,0,960,576);if(run.flash){ctx.fillStyle=`rgba(190,30,30,${run.flash*(reducedFx?.1:.25)})`;ctx.fillRect(0,0,960,576)}}
function loop(now){if(!run||run.finish)return;const dt=Math.min(.034,(now-last)/1000);last=now;if(!paused){const c=CFG[diff];run.sec-=dt;run.pwait=Math.max(0,run.pwait-dt);run.page+=dt;run.flash=Math.max(0,run.flash-dt*2.4);if(run.sec<=0){run.sec=0;finish(0);return}let dx=input.r-input.l,dy=input.d-input.u;if(dx||dy){const l=Math.hypot(dx,dy);dx/=l;dy/=l;run.p.fx=dx;run.p.fy=dy;let nx=run.p.x+dx*156*dt,ny=run.p.y+dy*156*dt;if(!blocked(nx,run.p.y))run.p.x=nx;if(!blocked(run.p.x,ny))run.p.y=ny}run.e.forEach(e=>{if(e.hp<=0)return;e.wait=Math.max(0,e.wait-dt);const d=dist(e.x,e.y,run.p.x,run.p.y),agg=e.kind==='boss'?520:245;if(d<agg&&d>24){const sp=c.eSpeed*(e.kind==='boss'?.78:e.kind==='crawler'?1.12:1),ex=e.x+(run.p.x-e.x)/d*sp*dt,ey=e.y+(run.p.y-e.y)/d*sp*dt;if(!blocked(ex,e.y,e.kind==='boss'?26:14))e.x=ex;if(!blocked(e.x,ey,e.kind==='boss'?26:14))e.y=ey}if(d<(e.kind==='boss'?48:28)&&e.wait<=0){e.wait=e.kind==='boss'?.72:1.05;run.p.hp-=c.touch*(e.kind==='boss'?1.65:1);run.flash=1;message(e.kind==='boss'?'폭압 충격! 거리를 벌리고 탐지 펄스를 사용하세요.':'가스 망령에게 노출되었습니다. 거리를 확보하세요.');if(run.p.hp<=0){run.p.hp=0;finish(0)}}});hudClock+=dt;if(hudClock>.12){hudClock=0;sync()}}const canvas=$('world');if(canvas)draw(canvas.getContext('2d'),now/1000);raf=requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowUp'||e.code==='KeyW')input.u=1;if(e.code==='ArrowDown'||e.code==='KeyS')input.d=1;if(e.code==='ArrowLeft'||e.code==='KeyA')input.l=1;if(e.code==='ArrowRight'||e.code==='KeyD')input.r=1;if(!e.repeat&&e.code==='Space')pulse();if(!e.repeat&&e.code==='KeyE')interact();if(!e.repeat&&e.code==='KeyQ')heal()},{passive:false});addEventListener('keyup',e=>{if(e.code==='ArrowUp'||e.code==='KeyW')input.u=0;if(e.code==='ArrowDown'||e.code==='KeyS')input.d=0;if(e.code==='ArrowLeft'||e.code==='KeyA')input.l=0;if(e.code==='ArrowRight'||e.code==='KeyD')input.r=0});intro();
